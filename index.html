<!DOCTYPE html>
<html>
<head>
    <title>🎯 Tebak Angka</title>
</head>
<body>

<h2>🎯 TEBAK ANGKA</h2>
<p>Kamu harus memilih angka dari 1 sampai 10.</p>

<input type="number" id="tebakan">
<button onclick="tebak()">Tebak</button>

<p id="hasil"></p>

<script>
function tebak() {
    let angkaRahasia = Math.floor(Math.random() * 10) + 1;
    let tebakan = Number(document.getElementById("tebakan").value);

    if (tebakan == angkaRahasia) {
        document.getElementById("hasil").innerHTML =
        "🔥 BENAR! SATU KOIN JEWS BUAT KAMU!";
    } else {
        document.getElementById("hasil").innerHTML =
        "❌ TOLOLLLLL Salah!!!!!!!<br>Angka yang benar adalah " + angkaRahasia;
    }
}
</script>

</body>
</html>
